<script>


/* ══ Popover ═══════════════════════════════════════════════════════ */
var activePop = null;
function togglePop(id, btn) {
  var pop = document.getElementById(id);
  if (!pop) return;
  if (activePop && activePop !== pop) {
    activePop.classList.remove('on');
    document.querySelectorAll('.br-btn.active,.q-btn.active').forEach(function(b){b.classList.remove('active');});
  }
  var isOn = pop.classList.contains('on');
  pop.classList.toggle('on', !isOn);
  btn.classList.toggle('active', !isOn);
  activePop = isOn ? null : pop;
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.br-btn') && !e.target.closest('.q-btn') && !e.target.closest('.pop')) {
    document.querySelectorAll('.pop.on').forEach(function(p){p.classList.remove('on');});
    document.querySelectorAll('.br-btn.active,.q-btn.active').forEach(function(b){b.classList.remove('active');});
    activePop = null;
  }
});


</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById('sidebarToggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
        });
      }
      document.querySelectorAll('.sidebar-collapsible').forEach(function (t) {
        var el = document.querySelector(t.getAttribute('data-bs-target'));
        if (el) {
          el.addEventListener('show.bs.collapse', function () {
            t.querySelector('.collapse-icon').style.transform = 'rotate(-90deg)';
          });
          el.addEventListener('hide.bs.collapse', function () {
            t.querySelector('.collapse-icon').style.transform = 'rotate(0deg)';
          });
        }
      });
    })();
  </script>
