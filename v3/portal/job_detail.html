<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#13795B;--gm:#1D9E75;--gl:#E8F7F2;--gb:#9FE1CB;
  --am:#C07A1A;--al:#FDF3E3;--ab:#F0C060;
  --rm:#B03030;--rl:#FDF0F0;--rb:#F0AAAA;
  --bm:#1A5FA8;--bl:#EBF3FD;--bb:#90BFED;
  --pm:#6B21A8;--pl:#F5F0FF;--pb:#C4B5FD;
  --ink:#1C1C1E;--ink2:#444;--ink3:#777;--ink4:#AAA;
  --s:#fff;--bg:#F5F6F8;--bdr:#E4E4E4;--bdr2:#F0F0F0;
  --r:10px;--rl2:16px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);display:block !important;}
#wrapper{display:flex;height:100vh;}
#sidebar{background-color:#6B21A8 !important;flex-shrink:0;}
#page-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* Shell */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:48px;background:var(--s);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:6px;flex-shrink:0;}
.topbar-title{font-size:14px;font-weight:600;}
.layout{flex:1;display:flex;overflow:hidden;}
.left-scroll{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.right-panel{width:290px;border-left:1px solid var(--bdr);background:var(--s);overflow-y:auto;flex-shrink:0;}

/* Breadcrumb */
.crumb{display:flex;align-items:center;gap:4px;font-size:13px;}
.crumb a{color:var(--g);text-decoration:none;font-weight:500;}
.crumb a:hover{text-decoration:underline;}
.crumb-sep{color:var(--ink4);font-size:12px;}

/* Cards */
.card{background:var(--s);border:1px solid var(--bdr);border-radius:var(--rl2);padding:18px;}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.card-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.ci-g{background:var(--gl)}.ci-b{background:var(--bl)}.ci-a{background:var(--al)}.ci-p{background:var(--pl)}.ci-r{background:var(--rl)}
.card-label{font-size:12px;font-weight:600;color:var(--ink2);flex:1;}

/* Job header */
.job-header{background:var(--s);border:1px solid var(--bdr);border-radius:var(--rl2);padding:20px 22px;display:flex;align-items:flex-start;gap:16px;}
.job-header-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.ji-chap{background:var(--bl)}.ji-befr{background:var(--gl)}.ji-home{background:var(--al)}.ji-cent{background:var(--pl)}
.job-header-main{flex:1;}
.job-id{font-size:11px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.job-title{font-size:18px;font-weight:700;color:var(--ink);line-height:1.2;}
.job-subtitle{font-size:13px;color:var(--ink3);margin-top:3px;}
.job-header-badges{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.job-header-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}

/* Info grid */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.info-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.info-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.info-box{background:var(--bg);border-radius:var(--r);padding:10px 12px;}
.info-label{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.info-val{font-size:13px;font-weight:500;color:var(--ink);}
.info-val.hi-g{color:var(--g);font-weight:700;}
.info-val.hi-p{color:var(--pm);font-weight:700;}
.info-val.hi-a{color:var(--am);font-weight:700;}
.info-val.hi-r{color:var(--rm);font-weight:700;}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-pub{background:var(--bl);color:var(--bm);}
.b-tak{background:var(--gl);color:var(--g);padding:12px; font-size:13px;}
.b-com{background:var(--gl);color:var(--g);padding:12px; font-size:13px;}
.b-can{background:var(--rl);color:var(--rm);padding:12px; font-size:13px;}
.b-wl{background:var(--al);color:var(--am);padding:12px; font-size:13px;}
.b-risk{background:var(--rl);color:var(--rm);padding:12px; font-size:13px;}
.b-reopen{background:var(--pl);color:var(--pm);padding:12px; font-size:13px;}
.b-prog{background:var(--bl);color:var(--bm);padding:12px; font-size:13px;}
.b-urg{background:#FFF3EC;color:#C04A00;border:1px solid #FFCFB2;padding:12px; font-size:13px;}
.b-std{background:var(--bg);color:var(--ink4);border:1px solid var(--bdr);padding:12px; font-size:13px;}
.b-draft{background:#E8E8ED;color:#555;padding:12px; font-size:13px;}
.b-submitted{background:var(--bl);color:var(--bm);padding:12px; font-size:13px;}
.b-processed{background:var(--gl);color:var(--g);padding:12px; font-size:13px;}
.b-amended{background:var(--al);color:var(--am);padding:12px; font-size:13px;}

/* Sect title */
.sect-title{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;margin-top:16px;}
.sect-title:first-child{margin-top:0;}

/* Banners */
.banner{border-radius:var(--r);padding:10px 12px;font-size:12px;display:flex;gap:8px;line-height:1.5;margin-bottom:12px;}
.bn-g{background:var(--gl);color:#0A5C46;border:1px solid var(--gb);}
.bn-a{background:var(--al);color:var(--am);border:1px solid var(--ab);}
.bn-r{background:var(--rl);color:var(--rm);border:1px solid var(--rb);}
.bn-p{background:var(--pl);color:var(--pm);border:1px solid var(--pb);}
.bn-b{background:var(--bl);color:var(--bm);border:1px solid var(--bb);}

/* Assignment slots */
.slot-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--bdr);}
.slot-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.sn-filled{background:var(--gm);color:#fff;}
.sn-empty{background:var(--bdr);color:var(--ink4);}
.slot-name{font-size:13px;font-weight:500;color:var(--ink);}
.slot-meta{font-size:11px;color:var(--ink4);margin-top:2px;}

/* Waitlist */
.wl-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bdr2);font-size:12px;}
.wl-row:last-child{border-bottom:none;}
.wl-pos{width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink4);flex-shrink:0;}
.wl-name{flex:1;font-weight:500;color:var(--ink2);}
.wl-time{font-size:11px;color:var(--ink4);}

/* Activity log */
.act-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdr2);position:relative;}
.act-row:last-child{border-bottom:none;}
.act-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.ad-g{background:var(--gm)}.ad-b{background:var(--bm)}.ad-a{background:#F0C060}.ad-r{background:var(--rm)}.ad-p{background:var(--pm)}.ad-k{background:#AAA}
.act-body{flex:1;}
.act-title{font-size:12px;font-weight:600;color:var(--ink2);}
.act-detail{font-size:11px;color:var(--ink4);margin-top:2px;line-height:1.4;}
.act-time{font-size:10px;color:var(--ink4);white-space:nowrap;margin-top:2px;}

/* Right panel */
.rp{padding:14px 15px;}
.rp-title{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;margin-top:16px;}
.rp-title:first-child{margin-top:4px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr2);font-size:12px;}
.summary-row:last-child{border-bottom:none;}
.summary-label{color:var(--ink3);}
.summary-val{font-weight:600;color:var(--ink);}
.summary-val.sv-g{color:var(--g);}
.summary-val.sv-p{color:var(--pm);}

/* Finance block */
.fin-block{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;}
.fin-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--bdr2);}
.fin-row:last-child{border-bottom:none;}
.fin-total{display:flex;justify-content:space-between;align-items:center;padding-top:8px;margin-top:4px;border-top:2px solid var(--bdr);}
.fin-total-label{font-size:13px;font-weight:700;}
.fin-total-val{font-size:18px;font-weight:800;color:var(--pm);}

/* Skill tags */
.skill-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--gl);color:var(--g);margin-right:5px;margin-bottom:5px;}
.skill-tag-b{background:var(--bl);color:var(--bm);}

/* Complexity pill */
.cplx-H{background:var(--rl);color:var(--rm);border:1px solid var(--rb);}
.cplx-M{background:var(--al);color:var(--am);border:1px solid var(--ab);}
.cplx-L{background:var(--gl);color:var(--g);border:1px solid var(--gb);}

/* Action buttons */
.btn-primary{background:var(--g);color:#fff;border:none;border-radius:var(--r);padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary:hover{background:#0A5C46;}
.btn-ghost{background:var(--s);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 14px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{background:var(--bg);}
.btn-danger{background:var(--rm);color:#fff;border:none;border-radius:var(--r);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-danger:hover{background:#8C2020;}

/* Draft footer */
.page-footer{height:56px;background:var(--s);border-top:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:8px;flex-shrink:0;}
.btn-pub{background:var(--g);color:#fff;border:none;border-radius:var(--r);padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.btn-pub:hover{background:#0A5C46;}
.btn-save-draft{background:var(--s);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 18px;font-size:13px;color:var(--ink3);cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.btn-save-draft:hover{background:var(--bg);}

/* Not found state */
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--ink4);}
.not-found i{font-size:48px;margin-bottom:12px;opacity:.3;}
.not-found h3{font-size:16px;font-weight:600;color:var(--ink3);margin-bottom:6px;}
.not-found p{font-size:13px;}
</style>
</head>

function calcBillableHours(mins) {
  if (mins <= 0) return 1;
  const h = Math.floor(mins / 60);
  const r = (mins / 60) - h;
  if (h === 0) return 1;
  return r >= 0.5 ? h + 1 : Math.max(1, h);
}

function fmtDuration(mins) {
  if (!mins || mins <= 0) return '—';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m > 0 ? m + 'm' : ''}`.trim() : `${m}m`;
}

  document.title = `CARES — ${j.type}`;
  document.getElementById('crumb-label').textContent = j.type + ' · ' + j.facility;

  const wl  = WAITLIST_DATA[jobId] || [];

  const isHA  = j.type === 'Home Assessment';

  const locked = j.status === 'Completed' || j.status === 'Cancelled' || j.status === 'In Progress';

  /* ── Banner ── */

    banner = `<div class="banner bn-r"><i class="bi bi-x-circle-fill"></i><div><strong>Cancelled:</strong> This job has been cancelled. Records are locked.</div></div>`;

  <div class="card">
    <div class="card-head">
      <div class="card-icon ci-p"><i class="bi bi-people" style="font-size:13px;color:var(--pm)"></i></div>
      <div class="card-label">Assignment &amp; Waitlist</div>
    </div>
    <div class="sect-title">Confirmed Slot${slots > 1 ? 's' : ''} (${slots} required)</div>
    ${slotsHtml}
    ${wlHtml}
  </div>`;

  /* ── Activity log ── */
  // const actLog = getActivityLog(j);
  // const actHtml = actLog.map(a => `
  // <div class="act-row">
  //   <div class="act-dot ${a.dot}"></div>
  //   <div class="act-body">
  //     <div class="act-title">${a.title}</div>
  //     <div class="act-detail">${a.detail}</div>
  //   </div>
  //   <div class="act-time">${a.time}</div>
  // </div>`).join('');

  // const actCard = `
  // <div class="card">
  //   <div class="card-head">
  //     <div class="card-icon" style="background:var(--bg);border:1px solid var(--bdr);"><i class="bi bi-clock-history" style="font-size:13px;color:var(--ink3)"></i></div>
  //     <div class="card-label">Activity Log</div>
  //   </div>
  //   ${actHtml}
  // </div>`;

  main.innerHTML = banner + header + jobCard + clientCard + matchCard + assignCard;

  /* ══ Right panel ════════════════════════════════════════════════ */
  let finBlock = '';
  if (fin) {
    const billable = calcBillableHours(fin.isNoShow ? 60 : fin.actualMins);
    const amount   = (billable * (fin.billRate || rate)).toFixed(2);
    const statusBadge = {
      'Draft':     `<span class="badge b-draft">Draft</span>`,
      'Submitted': `<span class="badge b-submitted">Submitted</span>`,
      'Processed': `<span class="badge b-processed">✓ Processed</span>`,
      'Amended':   `<span class="badge b-amended">⚠ Amended</span>`,
    }[fin.status] || `<span class="badge b-draft">${fin.status}</span>`;

    // finBlock = `
    // <div class="rp-title"><i class="bi bi-cash-stack"></i> Finance Summary</div>
    // <div class="fin-block">
    //   <div class="fin-row"><span style="color:var(--ink3)">Scheduled</span><span>${fmtDuration(fin.schedMins)}</span></div>
    //   <div class="fin-row"><span style="color:var(--ink3)">Actual (MJ)</span><span>${fin.isNoShow ? 'No-show (min 1h)' : fmtDuration(fin.actualMins)}</span></div>
    //   <div class="fin-row"><span style="color:var(--ink3)">Billable hrs</span><span style="font-weight:600;color:var(--pm)">${billable} hr${billable!==1?'s':''}</span></div>
    //   <div class="fin-row"><span style="color:var(--ink3)">Rate</span><span>$${(fin.billRate || rate).toFixed(2)} / hr</span></div>
    //   <div class="fin-row"><span style="color:var(--ink3)">AP Status</span><span>${statusBadge}</span></div>
    //   <div class="fin-total"><span class="fin-total-label">Total payable</span><span class="fin-total-val">$${amount}</span></div>
    // </div>
    // <a href="./finance.html" class="btn-ghost" style="width:100%;justify-content:center;margin-top:8px;font-size:12px;"><i class="bi bi-receipt"></i> View in Finance</a>`;
  } else {
    finBlock = `
    <div class="rp-title"><i class="bi bi-cash-stack"></i> Finance</div>
    <div style="font-size:12px;color:var(--ink4);padding:8px 0;line-height:1.5;">
      ${j.status === 'Completed' || j.status === 'In Progress'
        ? 'Payment record available in <a href="./finance.html" style="color:var(--pm);">Finance</a>.'
        : 'Payment record will be created after job completion.'}
    </div>`;
  }

  /* Slot count summary */
  const slotsInfo = `
  <div class="rp-title">Slot Summary</div>
  <div class="summary-row"><span class="summary-label">Required slots</span><span class="summary-val">${slots}</span></div>
  <div class="summary-row"><span class="summary-label">Confirmed</span><span class="summary-val sv-g">${mjNames.length}</span></div>
  <div class="summary-row"><span class="summary-label">Waitlist</span><span class="summary-val">${wl.length}</span></div>
  <div class="summary-row"><span class="summary-label">Auto-cancel</span><span class="summary-val">1 BD before</span></div>`;

  /* Quick links */
  const links = `
  <div class="rp-title">Quick Actions</div>
  <div style="display:flex;flex-direction:column;gap:8px;">
    <a href="./index.html?manage=${j.id}" class="btn-ghost" style="font-size:12px;justify-content:center;"><i class="bi bi-person-check"></i> Manage Assignment</a>
    <a href="./v1_mj_listing.html" class="btn-ghost" style="font-size:12px;justify-content:center;"><i class="bi bi-people"></i> MJ Registry</a>
  </div>`;

  rp.innerHTML = `<div class="rp">${finBlock}${slotsInfo}${links}</div>`;

  var isDraft = j.status === 'Draft';
  var isCancelled = j.status === 'Cancelled';
  document.getElementById('page-footer').style.display = (isDraft || isCancelled) ? 'flex' : 'none';
  document.getElementById('footer-save-draft').style.display = isDraft ? '' : 'none';
  document.getElementById('footer-publish').style.display = isDraft ? '' : 'none';
}

function showNotFound(main, rp, msg) {
  main.innerHTML = `
  <div class="not-found">
    <i class="bi bi-file-earmark-x"></i>
    <h3>Job Not Found</h3>
    <p>${msg}</p>
    <a href="./index.html" class="btn-ghost" style="margin-top:16px;"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
  </div>`;
  rp.innerHTML = '';
}

render();

function assignManually(idx) {
  var name = prompt('Enter MJ name to assign manually:');
  if (!name || !name.trim()) return;
  var row = document.getElementById('slot-' + idx);
  if (!row) return;
  document.getElementById('slot-name-' + idx).textContent = name.trim();
  document.getElementById('slot-name-' + idx).style.cssText = '';
  document.getElementById('slot-meta-' + idx).textContent = 'Manually assigned · Just now';
  document.getElementById('slot-num-' + idx).className = 'slot-num sn-filled';
  document.getElementById('slot-num-' + idx).textContent = '✓';
  var btn = row.querySelector('button');
  if (btn) btn.remove();
}

const sidebarToggle = document.getElementById('sidebarToggle');
if (sidebarToggle) {
  sidebarToggle.addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
